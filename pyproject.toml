[project]
name = "injecticide"
version = "0.9.1"
description = "Prompt injection stress-testing toolkit for cloud LLM endpoints"
requires-python = ">=3.10"
dependencies = ["requests", "rich", "pyyaml>=6.0", "jsonschema>=4.23,<5"]
license = { file = "LICENSE" }
authors = [ { name="Injecticide Contributors" } ]

[tool.setuptools]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
