services:
  injecticide:
    image: injecticide-web:${INJECTICIDE_IMAGE_TAG:-local}
    build: .
    container_name: injecticide-web
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SKILL_SANDBOX_URL=http://skill_sandbox:9001
    volumes:
      - ${INJECTICIDE_REPORTS_DIR:-./reports}:/app/reports
      - ./configs:/app/configs
    networks:
      - injecticide-network
      - skill-sandbox-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  skill_sandbox:
    image: injecticide-skill-sandbox:${INJECTICIDE_IMAGE_TAG:-local}
    build:
      context: ./skill_sandbox
    container_name: injecticide-skill-sandbox
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    networks:
      - skill-sandbox-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 9001), 5); connection.close()"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: injecticide-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      injecticide:
        condition: service_healthy
    networks:
      - injecticide-network
    restart: unless-stopped

networks:
  injecticide-network:
    driver: bridge
  skill-sandbox-net:
    internal: true
