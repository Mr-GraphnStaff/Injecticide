# https://docs.docker.com/engine/logging/drivers/json-file/
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  injecticide:
    image: injecticide-web:${INJECTICIDE_IMAGE_TAG:-local}
    build: .
    container_name: injecticide-web
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SKILL_SANDBOX_URL=http://skill_sandbox:9001
      - RESEARCH_MCP_URL=http://research_mcp:8200
    volumes:
      - ${INJECTICIDE_REPORTS_DIR:-./reports}:/app/reports
      - ./configs:/app/configs
    networks:
      - injecticide-network
      - skill-sandbox-net
      - research-net
    logging: *bounded-logging
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  skill_sandbox:
    image: injecticide-skill-sandbox:${INJECTICIDE_IMAGE_TAG:-local}
    build:
      context: ./skill_sandbox
    container_name: injecticide-skill-sandbox
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    networks:
      - skill-sandbox-net
    logging: *bounded-logging
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 9001), 5); connection.close()"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  research_mcp:
    image: injecticide-research-mcp:${INJECTICIDE_IMAGE_TAG:-local}
    build:
      context: ./research_mcp
    container_name: injecticide-research-mcp
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      - RESEARCH_INTERVAL_SECONDS=${INJECTICIDE_RESEARCH_INTERVAL_SECONDS:-3600}
      - RESEARCH_PAGE_BUDGET=${INJECTICIDE_RESEARCH_PAGE_BUDGET:-40}
    volumes:
      - research-data:/data
      - ./research_mcp/sources.json:/app/research_mcp/sources.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    networks:
      - research-net
    logging: *bounded-logging
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: injecticide-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      injecticide:
        condition: service_healthy
    networks:
      - injecticide-network
    logging: *bounded-logging
    restart: unless-stopped

networks:
  research-net:
    driver: bridge
  injecticide-network:
    driver: bridge
  skill-sandbox-net:
    internal: true

volumes:
  research-data:
